{% if error %}<h2 style="text-align:center">{{ error }}</h2>{% endif %}
<form action="" method="post">
<table style="margin-top:25px;">
	<tr>
		<th>Username</th>
		<td><input type="text" name="username" size="20" maxlength="30" value="{{ username|e }}" autofocus></td>
	</tr>
	<tr>
		<th>Password</th>
		<td><input type="password" name="password" size="20" maxlength="30" value=""></td>
	</tr>
	<tr>
		<td></td>
		<td><input type="submit" name="login" value="Continue" /></td>
	</tr>
</table>
</form>

{% if config.allow_signups %}
<hr>
<h1>Sign Up</h1>
<form action="" method="post">
<table style="margin-top:25px;">
	<tr>
		<th>Username (a-z, 0-9, no special characters)</th>
		<td><input type="text" name="username" size="20" maxlength="30" value=""></td>
	</tr>
	<tr>
		<th>Password (8-30 characters, use a generator)</th>
		<td><input type="password" name="password" size="20" maxlength="30" value=""></td>
	</tr>
	<tr>
		<th><label for="reason">Reason <small>(Give us a good reason as of why you want to have an account here.<br>Dumb answers wont be accepted and there's background checks.<br>Contact an admin directly otherwise)</small></label></th>
		<td><textarea name="reason" id="reason" style="width:100%;height:100px"></textarea></td>
	</tr>
	<tr>
		<td></td>
		<td><input type="submit" name="signup" value="Process" /></td>
	</tr>
</table>
</form>
{% endif %}
