map $http_cf_ipcountry $is_blocked_country {
	default 0;
	AU 1;
	GB 1;
	CN 1;
	IN 1;
}

server {
	listen 80;
	server_name avackusniche.org www.avackusniche.org;

	root /var/www/html;
	index index.html;

	# removes version from Server. hide information
	add_header Server "" always;
	add_header X-Powered-By "" always;
	server_tokens off;
	add_header Referrer-Policy "same-origin";
	autoindex off;

	# serve static pages
	location / {
		# show 418 for blocked countries
		if ($is_blocked_country) {
			return 418;
		}
		add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
		try_files $uri $uri/ =404;
	}

	# deny access to sensitive dirs
	location ~ ^/(inc|tmp|templates|vendor)(/|$) {
		deny all;
		return 403;
	}
	
	# php handling
	location ~ \.php$ {
		include fastcgi_params;
		fastcgi_pass php:9000;
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		client_max_body_size 10M;
	}

	# static file caching
	location ~* \.(jpg|jpeg|png|gif|ico|css|js|wad|spc|wasm|mwl|mp4|webm|webp|svg|woff2?)$ {
		expires 30d;
		access_log off;
	}

	# error pages
	error_page 403 /403.html;
	error_page 404 /404.html;
	error_page 418 /blocked.html;
	location = /blocked.html {
		default_type text/html;
		return 200 "<h1>418 Access Denied</h1><p>You are not allowed to access this site.</p>";
	}

	location = /403.html {
		internal;
	}

	location = /404.html {
		internal;
	}
}